<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NovoPath Medical: An intelligent, connected platform that empowers both patients and providers with seamless tools for a healthier tomorrow.">
  <title>NovoPath Medical</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom animations and styles */
    @keyframes slide-in-up {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    .animate-slide-in-up {
        animation: slide-in-up 0.5s ease-out forwards;
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in {
      animation: fade-in 0.6s ease-in-out forwards;
    }

    @keyframes fade-in-up {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    .animate-fade-in-up {
        animation: fade-in-up 0.5s ease-out forwards;
    }

    @keyframes text-focus-in {
      0% {
        -webkit-filter: blur(12px);
                filter: blur(12px);
        opacity: 0;
      }
      100% {
        -webkit-filter: blur(0px);
                filter: blur(0px);
        opacity: 1;
      }
    }
    .animate-text-focus-in {
      animation: text-focus-in 1s cubic-bezier(0.550, 0.085, 0.680, 0.530) both;
    }
    
    @keyframes pulse-badge {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.2); }
    }
    .animate-pulse-badge {
        animation: pulse-badge 1.5s infinite;
    }

    @keyframes pulse-bg-once {
      0% { background-color: transparent; }
      30% { background-color: rgba(59, 130, 246, 0.1); } /* primary-200/50 */
      100% { background-color: transparent; }
    }
    .animate-pulse-bg-once {
        animation: pulse-bg-once 1.5s ease-out;
    }

    .shimmer-bg {
        background-color: #e2e8f0;
        background-image: linear-gradient(to right, #e2e8f0 0%, #f1f5f9 50%, #e2e8f0 100%);
        background-repeat: no-repeat;
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
    }
    
    .stagger-list > * {
        animation: slide-in-up 0.5s ease-out backwards;
        animation-delay: calc(var(--stagger-index) * 100ms);
    }

    @keyframes mark-complete {
      0% { background-color: #a7f3d0; transform: scale(1); } /* emerald-200 */
      50% { transform: scale(1.03); }
      100% { background-color: #f3f4f6; transform: scale(1); } /* gray-100 */
    }
    .animate-mark-complete {
      animation: mark-complete 0.8s ease-out forwards;
    }

    /* Custom scrollbar for better aesthetics */
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }
    ::-webkit-scrollbar-track {
        background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: #9ca3af;
    }
    
    .gradient-text {
      background: linear-gradient(45deg, #2563eb, #14B8A6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-fill-color: transparent;
    }
    .scroll-indicator {
      animation: gentle-bounce 2.5s infinite ease-in-out;
    }
    @keyframes gentle-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    .fancy-card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .fancy-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }
    .testimonial-card::before {
      content: '“';
      position: absolute;
      top: -0.5rem;
      left: 1rem;
      font-size: 6rem;
      line-height: 1;
      font-family: 'Times New Roman', serif;
      color: #eff6ff;
      z-index: 0;
      transition: color 0.3s ease;
    }
    
    @keyframes floating {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(20px) rotate(10deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
     @keyframes slide-in-left {
      from {
        transform: translateX(-20px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    .animate-slide-in-left {
      animation: slide-in-left 0.3s ease-out forwards;
    }
    
    /* For printing receipts */
    @media print {
        body * {
            visibility: hidden;
        }
        #invoice-to-print, #invoice-to-print * {
            visibility: visible;
        }
        #invoice-to-print {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
        }
        .printable-invoice {
           font-family: sans-serif;
        }
    }
  </style>
  <script>
    // Tailwind custom theme configuration
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            },
            accent: '#14B8A6', // teal-500
            'accent-dark': '#0F766E', // teal-700
            'accent-light': '#A7F3D0', // emerald-200
            'tangerine': {
              DEFAULT: '#f59e0b', // amber-500
              'light': '#fde68a', // amber-200
              'dark': '#b45309' // amber-700
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    }
  </script>
